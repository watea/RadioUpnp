plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.watea.radio_upnp'
    compileSdk = 37

    defaultConfig {
        applicationId = 'com.watea.radio_upnp'
        minSdk = 26
        targetSdk = 36
        versionCode = 302035
        versionName = '3.02.035'
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles = [getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro']
        }
    }

    flavorDimensions = ['version']
    productFlavors {
        full {
            dimension = "version"
            buildConfigField 'boolean', 'HAS_CAST', 'true'
        }
        open {
            dimension = "version"
            buildConfigField 'boolean', 'HAS_CAST', 'false'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig = true
    }

    dependenciesInfo {
        // Disables dependency metadata when building APKs
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles
        includeInBundle = false
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:deprecation'
}

def media3 = '1.11.1'

dependencies {
    // AndroidX
    implementation 'androidx.core:core:1.19.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-exoplayer-hls:$media3" // Exoplayer codec
    implementation "androidx.media3:media3-exoplayer-dash:$media3" // Exoplayer codec
    implementation "androidx.media3:media3-datasource-okhttp:$media3" // Exoplayer OkHttp data source
    implementation "androidx.media3:media3-session:$media3" // Media3 session
    implementation 'androidx.mediarouter:mediarouter:1.9.0'
    implementation 'androidx.car.app:app:1.7.0' // Car App Library
    // Cast
    fullImplementation 'com.google.android.gms:play-services-cast-framework:23.0.0'
    // jsoup HTML parser library @ http://jsoup.org/
    implementation 'org.jsoup:jsoup:1.24.1'
    // CandidHttpServer
    implementation 'com.github.watea:candidhttpserver:2.0.0'
    // AndroidSsdpClient
    implementation 'com.github.watea:androidssdpclient:2.0.1'
    // okhttp
    implementation 'com.squareup.okhttp3:okhttp:5.5.1'
    // Billing
    fullImplementation 'com.android.billingclient:billing:9.1.0'
}